# Uses the existing Refiner checkpoint, training only a separate LoRA adapter.
model_name_or_path: /home/aim0/data/models/ASR/AgenticASR-Refiner
trust_remote_code: false
flash_attn: sdpa
cache_dir: .runtime/llamafactory-cache

stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: q_proj,v_proj

dataset_dir: experiments/llamafactory/data
dataset: refiner_local_train
eval_dataset: refiner_local_dev
# Registered by run_refiner_llamafactory.py to match the runtime no-think prefix.
template: agenticasr_local_nothink
enable_thinking: false
cutoff_len: 1024
packing: false
train_on_prompt: false
preprocessing_num_workers: 1
dataloader_num_workers: 0
overwrite_cache: false

output_dir: results/refiner_lora_20261010
overwrite_output_dir: false
logging_steps: 5
save_strategy: epoch
eval_strategy: epoch
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
plot_loss: true
save_only_model: false
report_to: none
push_to_hub: false

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
num_train_epochs: 3
learning_rate: 0.0001
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
optim: adamw_torch
bf16: true
fp16: false
gradient_checkpointing: true
seed: 20261010
data_seed: 20261010
